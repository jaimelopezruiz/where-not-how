[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "where-not-how"
version = "0.1.0"
description = "Cube-pushing demonstrations recorded on a webcam, used as object-trajectory commands for a manipulator in MuJoCo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Pinned to the versions installed and tested (Python 3.11, Windows).
# opencv-contrib-python is required for cv2.aruco. If another package pulls in
# opencv-python-headless, cv2.imshow breaks: restore with
#   pip install --force-reinstall --no-deps "opencv-contrib-python==5.0.0.93"
dependencies = [
    "mujoco==3.15.0",
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.0",
    "torch==2.14.1",          # stable-baselines3 backend, pinned for reproducible training
    "opencv-contrib-python==5.0.0.93",
    "mediapipe==1.1.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "matplotlib==3.11.2",
    "imageio==2.38.0",
    "pyyaml==6.0.3",          # data/props.yaml
]

[tool.setuptools.packages.find]
include = ["capture*", "extract*", "sim*", "control*", "rl*", "eval*"]

[tool.setuptools.package-data]
"control.kinematics" = ["*.urdf"]
